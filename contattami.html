<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contattami | Eugenio Conte, Web Specialist e Digital Marketer</title>
  <meta name="description" content="Scrivi a Eugenio Conte per un progetto di digital marketing, video editing o gestione sito: compila il form e riceverai una risposta.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Contattami | Eugenio Conte">
  <meta property="og:description" content="Hai un progetto in mente? Scrivimi tramite il form.">
  <meta property="og:image" content="img/og-cover.svg">
  <meta property="og:locale" content="it_IT">

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-md site-nav" aria-label="Navigazione principale">
      <div class="container">
        <a class="navbar-brand" href="index.html">Eugenio Conte</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Apri il menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contattami.html">Contattami</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <p class="eyebrow">&#10022; Contatti &#10022;</p>
        <h1>Contattami</h1>
        <p class="lead">Hai un progetto in mente? Scrivimi con il form: ti rispondo il prima possibile.</p>

        <form action="https://formsubmit.co/eugenio.conte.dm@gmail.com" method="post" class="form" id="contact-form">
          <input type="hidden" name="_subject" value="Nuovo messaggio dal portfolio">
          <input type="hidden" name="_template" value="table">
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Il tuo nome" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nome@esempio.it" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="oggetto">Oggetto</label>
            <input type="text" id="oggetto" name="oggetto" placeholder="Di cosa vuoi parlare?" required>
          </div>
          <div class="field">
            <label for="messaggio">Messaggio</label>
            <textarea id="messaggio" name="messaggio" rows="5" placeholder="Raccontami il tuo progetto" required></textarea>
          </div>
          <button type="submit" class="btn-brand">Invia messaggio</button>
          <p class="form__status" id="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Eugenio Conte. Tutti i diritti riservati.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
